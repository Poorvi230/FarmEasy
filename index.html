<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Farm Manager</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div id="app">
            <header class="topbar">
                <h1> Farm Manager </h1>
            </header>
            <main class="content">
                <section id="dashboard-view">
                    <h2>Morning Brief</h2>
                    <p style="margin-bottom: 20px; color: #888;">Welcome to the land!</p>
                    <div class="dashboard-grid">
                        <!--weather stuff-->
                        <div class="dash-card weather_widget">
                            <h3> Weather</h3>
                            <p>72°F and Sunny</p>
                            <small>Perfect day to plant that crop</small>
                        </div>
                        <!--animalssss-->
                        <div class="dash-card">
                            <h3>Livestock</h3>
                            <ul>
                                <li> 12 Cows</li>
                                <li> 45 Chickens</li>
                                <!--<li> 10 Pigs</li>-->
                            </ul>
                        </div>
                        <!--alert fahhh-->
                        <div class="death-card alert-card">
                            <h3>Attention!!!!</h3>
                            <p>Tractor A needs oil change</p>
                            <button class="btn-primary">Acknowledge</button>
                        </div>
                    </div>
                </section>
                
                <section id="tasks-view">
                    <h2>Chore Board</h2>             
                </section>
                <section id="assets-view" class="hidden">
                    <h2>Barn & Garage</h2>
                </section>
            </main>

            <nav class="bottom-nav">
                <button class="nav-btn active" data-target="dashboard-view">Dashboard</button>
                <button class="nav-btn" data-target="tasks-view"> Tasks</button>
                <button class="nav-btn" data-target="assets-view"> Assets</button>
            </nav>
        </div>

        <script type="module" src=/main.js></script>""
    </body>
</html>
